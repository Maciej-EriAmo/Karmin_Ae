# B5 — regresja pamięci SE na PR / push (bez sieci LLM, bez holon_memory.json z gita)
name: holon-eval

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  memory-eval:
    name: golden eval + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Golden memory eval
        run: python holon_agent_memory.py eval

      - name: Unit tests
        run: python -m unittest discover -s tests -v
